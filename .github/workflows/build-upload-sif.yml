name: Build and upload Apptainer image

on:
  workflow_call:
    inputs:
      repo_name:
        description: "Repository name of the model"
        required: true
        type: string
      version:
        description: "Docker image tag to build from (e.g. v2.0.1); only the major part names the .sif"
        required: true
        type: string
      runner:
        required: true
        type: string
      skip_if_unchanged:
        description: "Skip the rebuild when the image of this release is the same as the previous release (a PATCH); only the release label on the .sif is updated"
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ACCESS_KEY:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AIRTABLE_API_KEY:
        required: false
    outputs:
      apptainer-url:
        description: "Public URL of the uploaded .sif"
        value: ${{ jobs.build-sif.outputs.url }}

jobs:
  build-sif:
    runs-on: ${{ inputs.runner }}
    env:
      MODEL_ID: ${{ inputs.repo_name }}
      VERSION: ${{ inputs.version }}
      SIF_BUCKET: models-sif
      SIF_REGION: eu-north-1
    outputs:
      url: ${{ steps.upload.outputs.url }}
    steps:
      # Read the model from ersilia-os/<model>, so the workflow can also be tried
      # from another repository
      - name: Checkout model repository
        uses: actions/checkout@v4.2.2
        with:
          repository: ersilia-os/${{ inputs.repo_name }}
          ref: main
          persist-credentials: false
          lfs: false

      - name: Pull with rebase
        run: |
          git pull --rebase origin main

      # A PATCH release retags the image of the previous release, so the .sif
      # would be identical: keep the file and only update its release label
      - name: Decide whether to rebuild
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_IF_UNCHANGED: ${{ inputs.skip_if_unchanged }}
        run: |
          SIF_KEY="${MODEL_ID}_${VERSION%%.*}.sif"
          SIF_URL="https://${SIF_BUCKET}.s3.${SIF_REGION}.amazonaws.com/${SIF_KEY}"
          REBUILD=true
          if [[ "$SKIP_IF_UNCHANGED" == "true" ]]; then
            PREVIOUS="$(gh api "repos/ersilia-os/${MODEL_ID}/tags" --paginate --jq '.[].name' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V \
              | awk -v v="$VERSION" '$0 == v { print prev; exit } { prev = $0 }')"
            digest() {
              docker buildx imagetools inspect "ersiliaos/${MODEL_ID}:$1" --format '{{json .Manifest}}' | jq -r .digest
            }
            if [[ -n "$PREVIOUS" && "${PREVIOUS%%.*}" == "${VERSION%%.*}" ]] \
              && [[ "$(digest "$VERSION")" == "$(digest "$PREVIOUS")" ]] \
              && curl -sfI "$SIF_URL" > /dev/null; then
              echo "Image of $VERSION is the same as $PREVIOUS and $SIF_KEY exists: no rebuild."
              REBUILD=false
            fi
          fi
          echo "rebuild=$REBUILD" >> "$GITHUB_OUTPUT"
          echo "sif_key=$SIF_KEY" >> "$GITHUB_OUTPUT"

      - name: Update release label only
        if: steps.decide.outputs.rebuild == 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SIF_KEY: ${{ steps.decide.outputs.sif_key }}
        run: |
          # A server-side copy onto itself: nothing is downloaded and the URL stays the same
          aws s3 cp "s3://${SIF_BUCKET}/${SIF_KEY}" "s3://${SIF_BUCKET}/${SIF_KEY}" \
            --region "$SIF_REGION" --metadata "release=${VERSION}" --metadata-directive REPLACE \
            --content-type application/octet-stream
          curl -sI "https://${SIF_BUCKET}.s3.${SIF_REGION}.amazonaws.com/${SIF_KEY}" | grep -i x-amz-meta-release

      # ---- Dependencies ----

      - name: Install Apptainer
        if: steps.decide.outputs.rebuild == 'true'
        run: |
          # The runner's packages.microsoft.com repo ships a newer containernetworking-plugins
          # (an apptainer dependency) and rate-limits downloads (429); prefer Ubuntu's copy
          printf 'Package: *\nPin: origin "packages.microsoft.com"\nPin-Priority: 1\n' \
            | sudo tee /etc/apt/preferences.d/no-microsoft-prod > /dev/null
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y apptainer
          if ! command -v singularity >/dev/null; then
            sudo ln -s "$(command -v apptainer)" /usr/local/bin/singularity
          fi
          singularity --version
          # The smoke test runs the .sif as a normal user, which needs unprivileged
          # user namespaces. Ubuntu 24.04+ runners block them through AppArmor;
          # HPC Apptainer installs allow them, so lift the restriction here.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set up Python
        if: steps.decide.outputs.rebuild == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No conda here: setup-miniconda appends `set -eo pipefail` to ~/.profile, and
      # $HOME is mounted into the .sif, where the login shell (dash) rejects it
      - name: Install Python dependencies
        if: steps.decide.outputs.rebuild == 'true'
        run: |
          pip install ruamel.yaml
          pip install "git+https://github.com/ersilia-os/ersilia-apptainer.git"
          # ersilia and these are for the Airtable/README scripts
          pip install "git+https://github.com/ersilia-os/ersilia.git@master"
          pip install requests pyairtable boto3

      # ---- Build, test and upload ----

      - name: Set paths
        if: steps.decide.outputs.rebuild == 'true'
        run: |
          # Same <model>_<major>.sif name ersilia_apptainer gives the file;
          # "Build .sif" fails if the two ever disagree
          SIF_NAME="${MODEL_ID}_${VERSION%%.*}.sif"
          # Outside the workspace so the later commit steps cannot pick up build files
          WORK_DIR="$RUNNER_TEMP/apptainer"
          mkdir -p "$WORK_DIR/tmp" "$WORK_DIR/cache" "$WORK_DIR/out"
          {
            echo "SIF_NAME=$SIF_NAME"
            echo "SIF_PATH=$WORK_DIR/out/$SIF_NAME"
            echo "WORK_DIR=$WORK_DIR"
            echo "APPTAINER_TMPDIR=$WORK_DIR/tmp"
            echo "APPTAINER_CACHEDIR=$WORK_DIR/cache"
            echo "SIF_URL=https://${SIF_BUCKET}.s3.${SIF_REGION}.amazonaws.com/${SIF_NAME}"
          } >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP"

      - name: Build .sif
        if: steps.decide.outputs.rebuild == 'true'
        run: |
          sudo -E env "PATH=$PATH" ersilia_apptainer create \
            --model "$MODEL_ID" \
            --version "$VERSION" \
            --output-dir "$WORK_DIR/out"
          if [[ ! -f "$SIF_PATH" ]]; then
            echo "::error::Expected $SIF_NAME, but ersilia_apptainer wrote: $(ls -A "$WORK_DIR/out" | tr '\n' ' ')"
            exit 1
          fi
          sudo chown "$USER" "$SIF_PATH"
          ls -lh "$SIF_PATH"

      - name: Smoke test
        if: steps.decide.outputs.rebuild == 'true'
        run: |
          EXAMPLES=/opt/ersilia/model/framework/examples
          singularity exec "$SIF_PATH" cat "$EXAMPLES/run_input.csv" > "$WORK_DIR/input.csv" \
            || singularity exec "$SIF_PATH" cat "$EXAMPLES/input.csv" > "$WORK_DIR/input.csv"
          singularity exec "$SIF_PATH" cat "$EXAMPLES/run_output.csv" > "$WORK_DIR/expected.csv" 2>/dev/null \
            || singularity exec "$SIF_PATH" cat "$EXAMPLES/output.csv" > "$WORK_DIR/expected.csv" 2>/dev/null \
            || true

          ersilia_apptainer run \
            --sif "$SIF_PATH" \
            --input "$WORK_DIR/input.csv" \
            --output "$WORK_DIR/output.csv"

          # ersilia_apptainer already checks the row count; also check the columns
          python - <<'EOF'
          import csv, os
          work = os.environ["WORK_DIR"]
          def header(path):
              with open(path) as f:
                  cols = next(csv.reader(f), [])
              return [c for c in cols if c not in ("key", "input")]
          got = header(f"{work}/output.csv")
          expected_path = f"{work}/expected.csv"
          if os.path.getsize(expected_path) == 0:
              print("::warning::No example output in the image; skipping the column check.")
          else:
              expected = header(expected_path)
              if got != expected:
                  raise SystemExit(f"Output columns differ from the example output:\n  got:      {got}\n  expected: {expected}")
          print(f"Output columns OK: {got}")
          EOF

      - name: Upload to S3
        id: upload
        if: steps.decide.outputs.rebuild == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # The release label tells which release the file holds: the name has the major only
          aws s3 cp "$SIF_PATH" "s3://${SIF_BUCKET}/${SIF_NAME}" --region "$SIF_REGION" \
            --metadata "release=${VERSION}" --content-type application/octet-stream
          curl -sfI "$SIF_URL" > /dev/null || { echo "Uploaded, but $SIF_URL is not publicly reachable"; exit 1; }
          echo "url=$SIF_URL" >> "$GITHUB_OUTPUT"
          echo "Uploaded $SIF_URL"

      - name: Update metadata field
        if: steps.upload.outcome == 'success'
        run: |
          if [[ -f metadata.yml ]]; then
            METADATA_FILE="metadata.yml"
          else
            METADATA_FILE="metadata.json"
          fi
          wget -O add_field_to_metadata.py https://raw.githubusercontent.com/ersilia-os/ersilia-model-workflows/main/.github/scripts/add_field_to_metadata.py
          python add_field_to_metadata.py --metadata_file "$METADATA_FILE" --field "Apptainer" --content "$SIF_URL"
          cat "$METADATA_FILE"
          rm add_field_to_metadata.py

      - name: Commit and push metadata changes
        if: steps.upload.outcome == 'success'
        uses: actions-js/push@master
        with:
          author_name: "ersilia-bot"
          author_email: "ersilia-bot@users.noreply.github.com"
          message: "updating metadata [skip ci]"
          repository: ${{ github.repository }}
          branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # ---- Record the new image ----
      - name: Update metadata to AirTable
        if: steps.upload.outcome == 'success'
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: |
          wget https://raw.githubusercontent.com/ersilia-os/ersilia/master/.github/scripts/airtableops.py
          wget https://raw.githubusercontent.com/ersilia-os/ersilia/master/.github/scripts/readme_formatter.py
          if [[ -f metadata.yml ]]; then
            export METADATA_FILE="metadata.yml"
          else
            export METADATA_FILE="metadata.json"
          fi
          # Same as `airtableops.py airtable-update`, but reads the checked-out file:
          # raw.githubusercontent.com caches for 5 minutes and can still serve the
          # metadata from before this job's push
          python - <<'EOF'
          import os
          from ersilia.hub.content.card import RepoMetadataFile
          from airtableops import AirtableMetadata
          model = os.environ["MODEL_ID"]
          bi = RepoMetadataFile(model_id=model, config_json=None).read_information(
              json_or_yaml_path=os.environ["METADATA_FILE"])
          print(f"Apptainer: {bi.apptainer}")
          AirtableMetadata(model_id=model, api_key=os.environ["AIRTABLE_API_KEY"], mode="rw").write_information(bi)
          EOF
          rm airtableops.py
          rm readme_formatter.py

      - name: Sync metadata to S3 JSON
        if: steps.upload.outcome == 'success'
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          wget https://raw.githubusercontent.com/ersilia-os/ersilia/master/.github/scripts/convert_airtable_to_json.py
          python convert_airtable_to_json.py $AIRTABLE_API_KEY $AWS_ACCESS_KEY_ID $AWS_SECRET_ACCESS_KEY
          rm convert_airtable_to_json.py

      - name: Update README file
        if: steps.upload.outcome == 'success'
        run: |
          wget https://raw.githubusercontent.com/ersilia-os/ersilia/master/.github/scripts/airtableops.py
          wget https://raw.githubusercontent.com/ersilia-os/ersilia/master/.github/scripts/readme_formatter.py
          python airtableops.py readme-update --repo $MODEL_ID --path .
          rm airtableops.py
          rm readme_formatter.py

      - name: Commit and push README changes
        if: steps.upload.outcome == 'success'
        uses: actions-js/push@master
        with:
          author_name: "ersilia-bot"
          author_email: "ersilia-bot@users.noreply.github.com"
          message: "updating readme [skip ci]"
          repository: ${{ github.repository }}
          branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
