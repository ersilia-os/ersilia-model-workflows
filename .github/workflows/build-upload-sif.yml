name: Build and upload Apptainer image

on:
  workflow_call:
    inputs:
      repo_name:
        description: "Repository name of the model"
        required: true
        type: string
      version:
        description: "Docker image tag to build from (e.g. v2.0.1); only the major part names the .sif"
        required: true
        type: string
      runner:
        required: true
        type: string
      branch:
        # TESTING PHASE: models under test must have an apptainer-test branch.
        # Change the default back to "main" before this goes live.
        description: "Branch of the model repository to read metadata from and commit to"
        required: false
        type: string
        default: "main"
      ersilia_apptainer_ref:
        description: "Git ref of ersilia-apptainer to install"
        required: false
        type: string
        default: "e4004721f90b23a0da7920da191e74aae52739d8"
      scripts_ref:
        description: "Branch of ersilia-model-workflows to take helper scripts from"
        required: false
        type: string
        default: "main"
      ersilia_ref:
        description: "Branch of ersilia to install and take the Airtable/README scripts from"
        required: false
        type: string
        default: "master"
      device:
        description: "cpu, or gpu to build <model>_<major>-gpu.sif from the <version>-gpu image (no metadata update)"
        required: false
        type: string
        default: "cpu"
    secrets:
      AWS_ACCESS_KEY:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AIRTABLE_API_KEY:
        required: false
    outputs:
      apptainer-url:
        description: "Public URL of the uploaded .sif, empty if the build was skipped"
        value: ${{ jobs.build-sif.outputs.url }}

jobs:
  build-sif:
    runs-on: ${{ inputs.runner }}
    env:
      MODEL_ID: ${{ inputs.repo_name }}
      VERSION: ${{ inputs.version }}
      DEVICE: ${{ inputs.device }}
      SIF_BUCKET: models-sif
      SIF_REGION: eu-north-1
    outputs:
      url: ${{ steps.upload.outputs.url }}
    steps:
      # Read the model from ersilia-os/<model>, so the workflow can also be tried
      # from a test branch or another repository
      - name: Checkout model repository
        uses: actions/checkout@v4.2.2
        with:
          repository: ersilia-os/${{ inputs.repo_name }}
          ref: ${{ inputs.branch }}
          persist-credentials: false
          lfs: false

      - name: Pull with rebase
        run: |
          git pull --rebase origin "${{ inputs.branch }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyaml and ruamel.yaml
        run: |
          pip install pyaml
          pip install ruamel.yaml

      # The runner builds the amd64 image. :latest (and so the version tag) can contain an
      # amd64 image that failed its deep test, so only build if AMD64 is recorded as passing.
      # For gpu, the Device field must list GPU (the GPU image is amd64 only).
      - name: Check the image passed its test
        id: arch
        run: |
          python - <<'EOF'
          import json, os
          path = "metadata.yml" if os.path.exists("metadata.yml") else "metadata.json"
          with open(path) as f:
              if path.endswith(".json"):
                  data = json.load(f)
              else:
                  import yaml
                  data = yaml.safe_load(f)
          arch = data.get("Docker Architecture") or []
          if isinstance(arch, str):
              arch = [a.strip() for a in arch.split(",")]
          print(f"Docker Architecture: {arch}")
          ok = "AMD64" in arch
          if os.environ["DEVICE"] == "gpu":
              device = data.get("Device") or []
              if isinstance(device, str):
                  device = [d.strip() for d in device.strip("[]").split(",")]
              print(f"Device: {device}")
              ok = "GPU" in device
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"build={'true' if ok else 'false'}\n")
          EOF

      - name: Skip notice
        if: steps.arch.outputs.build != 'true'
        run: |
          echo "::warning::${MODEL_ID} has no passing ${DEVICE^^} image; skipping the Apptainer build."

      - name: Set paths
        if: steps.arch.outputs.build == 'true'
        run: |
          MAJOR="v${VERSION#v}"
          MAJOR="${MAJOR%%.*}"
          SIF_NAME="${MODEL_ID}_${MAJOR}.sif"
          IMAGE_TAG="$VERSION"
          if [[ "$DEVICE" == "gpu" ]]; then
            SIF_NAME="${MODEL_ID}_${MAJOR}-gpu.sif"
            IMAGE_TAG="${VERSION}-gpu"
          fi
          # Outside the workspace so the later commit steps cannot pick up build files
          WORK_DIR="$RUNNER_TEMP/apptainer"
          mkdir -p "$WORK_DIR/tmp" "$WORK_DIR/cache" "$WORK_DIR/out"
          {
            echo "SIF_NAME=$SIF_NAME"
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "SIF_PATH=$WORK_DIR/out/$SIF_NAME"
            echo "WORK_DIR=$WORK_DIR"
            echo "APPTAINER_TMPDIR=$WORK_DIR/tmp"
            echo "APPTAINER_CACHEDIR=$WORK_DIR/cache"
            echo "SIF_URL=https://${SIF_BUCKET}.s3.${SIF_REGION}.amazonaws.com/${SIF_NAME}"
          } >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP"

      # GPU images are several GB and the build needs about three times that
      - name: Free Disk Space (Ubuntu)
        if: steps.arch.outputs.build == 'true' && inputs.device == 'gpu'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Apptainer
        if: steps.arch.outputs.build == 'true'
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          # ersilia-apptainer calls `singularity`; the apptainer package normally ships it
          if ! command -v singularity >/dev/null; then
            sudo ln -s "$(command -v apptainer)" /usr/local/bin/singularity
          fi
          singularity --version

      - name: Install ersilia-apptainer
        if: steps.arch.outputs.build == 'true'
        run: |
          pip install "git+https://github.com/ersilia-os/ersilia-apptainer.git@${{ inputs.ersilia_apptainer_ref }}"

      # Built as root: unprivileged builds rely on user namespaces, which the
      # Ubuntu 24.04 runners restrict.
      - name: Build .sif
        if: steps.arch.outputs.build == 'true'
        run: |
          sudo -E env "PATH=$PATH" ersilia_apptainer create \
            --model "$MODEL_ID" \
            --version "$IMAGE_TAG" \
            --output-dir "$WORK_DIR/out"
          # ersilia_apptainer names the file after the major version only
          BUILT="$WORK_DIR/out/$(basename "${SIF_PATH/-gpu.sif/.sif}")"
          if [[ "$BUILT" != "$SIF_PATH" ]]; then
            sudo mv "$BUILT" "$SIF_PATH"
          fi
          sudo chown "$USER" "$SIF_PATH"
          ls -lh "$SIF_PATH"

      # The smoke test runs the .sif as a normal user, which needs unprivileged
      # user namespaces. Ubuntu 24.04+ runners block them through AppArmor;
      # HPC Apptainer installs allow them, so lift the restriction here.
      - name: Allow unprivileged user namespaces
        if: steps.arch.outputs.build == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The runner has no GPU, so main_gpu.py cannot run: check the image selects it
      - name: Smoke test (GPU)
        if: steps.arch.outputs.build == 'true' && inputs.device == 'gpu'
        run: |
          singularity exec "$SIF_PATH" sh -c '
            set -e
            test "$ERSILIA_DEVICE" = gpu || { echo "ERSILIA_DEVICE is not gpu"; exit 1; }
            ls /opt/ersilia/bundles/*/*/model/framework/code/main_gpu.py
          '
          echo "Structural checks passed. No GPU on this runner: inference was not tested."

      - name: Smoke test
        if: steps.arch.outputs.build == 'true' && inputs.device != 'gpu'
        run: |
          EXAMPLES=/opt/ersilia/model/framework/examples
          singularity exec "$SIF_PATH" cat "$EXAMPLES/run_input.csv" > "$WORK_DIR/input.csv" \
            || singularity exec "$SIF_PATH" cat "$EXAMPLES/input.csv" > "$WORK_DIR/input.csv"
          singularity exec "$SIF_PATH" cat "$EXAMPLES/run_output.csv" > "$WORK_DIR/expected.csv" 2>/dev/null \
            || singularity exec "$SIF_PATH" cat "$EXAMPLES/output.csv" > "$WORK_DIR/expected.csv" 2>/dev/null \
            || true

          ersilia_apptainer run \
            --sif "$SIF_PATH" \
            --input "$WORK_DIR/input.csv" \
            --output "$WORK_DIR/output.csv"

          # ersilia_apptainer already checks the row count; also check the columns
          python - <<'EOF'
          import csv, os
          work = os.environ["WORK_DIR"]
          def header(path):
              with open(path) as f:
                  cols = next(csv.reader(f), [])
              return [c for c in cols if c not in ("key", "input")]
          got = header(f"{work}/output.csv")
          expected_path = f"{work}/expected.csv"
          if os.path.getsize(expected_path) == 0:
              print("::warning::No example output in the image; skipping the column check.")
          else:
              expected = header(expected_path)
              if got != expected:
                  raise SystemExit(f"Output columns differ from the example output:\n  got:      {got}\n  expected: {expected}")
          print(f"Output columns OK: {got}")
          EOF

      - name: Upload to S3
        id: upload
        if: steps.arch.outputs.build == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp "$SIF_PATH" "s3://${SIF_BUCKET}/${SIF_NAME}" --region "$SIF_REGION"
          curl -sfI "$SIF_URL" > /dev/null || { echo "Uploaded, but $SIF_URL is not publicly reachable"; exit 1; }
          echo "url=$SIF_URL" >> "$GITHUB_OUTPUT"
          echo "Uploaded $SIF_URL"

      - name: Update metadata field
        if: steps.upload.outcome == 'success' && inputs.device != 'gpu'
        run: |
          if [[ -f metadata.yml ]]; then
            METADATA_FILE="metadata.yml"
          else
            METADATA_FILE="metadata.json"
          fi
          wget -O add_field_to_metadata.py https://raw.githubusercontent.com/ersilia-os/ersilia-model-workflows/${{ inputs.scripts_ref }}/.github/scripts/add_field_to_metadata.py
          python add_field_to_metadata.py --metadata_file "$METADATA_FILE" --field "Apptainer" --content "$SIF_URL"
          cat "$METADATA_FILE"
          rm add_field_to_metadata.py

      - name: Commit and push metadata changes
        if: steps.upload.outcome == 'success' && inputs.device != 'gpu'
        uses: actions-js/push@master
        with:
          author_name: "ersilia-bot"
          author_email: "ersilia-bot@users.noreply.github.com"
          message: "updating metadata [skip ci]"
          repository: ${{ github.repository }}
          branch: ${{ inputs.branch }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup conda
        if: steps.upload.outcome == 'success' && inputs.device != 'gpu'
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"

      - name: Install dependencies in Conda environment
        if: steps.upload.outcome == 'success' && inputs.device != 'gpu'
        run: |
          conda run -n base python -m pip install "git+https://github.com/ersilia-os/ersilia.git@${{ inputs.ersilia_ref }}"
          conda run -n base pip install requests pyairtable boto3

      # Reads metadata.yml from GitHub, so it must run after the commit above
      - name: Update metadata to AirTable
        if: steps.upload.outcome == 'success' && inputs.device != 'gpu'
        env:
          USER_NAME: ${{ github.repository_owner }}
          REPO_NAME: ${{ inputs.repo_name }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
        run: |
          wget https://raw.githubusercontent.com/ersilia-os/ersilia/${{ inputs.ersilia_ref }}/.github/scripts/airtableops.py
          wget https://raw.githubusercontent.com/ersilia-os/ersilia/${{ inputs.ersilia_ref }}/.github/scripts/readme_formatter.py
          conda run -n base python3 airtableops.py airtable-update --user $USER_NAME --repo $REPO_NAME --branch "${{ inputs.branch }}" --api-key $AIRTABLE_API_KEY
          rm airtableops.py
          rm readme_formatter.py

      - name: Sync metadata to S3 JSON
        if: steps.upload.outcome == 'success' && inputs.device != 'gpu'
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          wget https://raw.githubusercontent.com/ersilia-os/ersilia/${{ inputs.ersilia_ref }}/.github/scripts/convert_airtable_to_json.py
          conda run -n base python convert_airtable_to_json.py $AIRTABLE_API_KEY $AWS_ACCESS_KEY_ID $AWS_SECRET_ACCESS_KEY
          rm convert_airtable_to_json.py

      - name: Update README file
        if: steps.upload.outcome == 'success' && inputs.device != 'gpu'
        run: |
          wget https://raw.githubusercontent.com/ersilia-os/ersilia/${{ inputs.ersilia_ref }}/.github/scripts/airtableops.py
          wget https://raw.githubusercontent.com/ersilia-os/ersilia/${{ inputs.ersilia_ref }}/.github/scripts/readme_formatter.py
          conda run -n base python3 airtableops.py readme-update --repo $MODEL_ID --path .
          rm airtableops.py
          rm readme_formatter.py

      - name: Commit and push README changes
        if: steps.upload.outcome == 'success' && inputs.device != 'gpu'
        uses: actions-js/push@master
        with:
          author_name: "ersilia-bot"
          author_email: "ersilia-bot@users.noreply.github.com"
          message: "updating readme [skip ci]"
          repository: ${{ github.repository }}
          branch: ${{ inputs.branch }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
